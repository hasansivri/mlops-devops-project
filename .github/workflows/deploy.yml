name: MLOps Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      # Daha güvenli ve hata ayıklaması kolay Docker Login yöntemi
      - name: Docker Login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/model-api:latest ./model-api

      - name: Push Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/model-api:latest

      - name: Deploy to Kubernetes
        run: |
          # 1. Kubeconfig klasörünü oluştur ve dosyayı yaz
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > ~/.kube/config
          
          # 2. Kubernetes klasöründeki manifestleri uygula
          kubectl apply -f k8s/
          
          # 3. Yeni imajın çekildiğinden emin olmak için restart at (Önemli!)
          # Not: deployment adın k8s klasöründekiyle aynı olmalı
          kubectl rollout restart deployment/model-api-deployment
          
          # 4. Status kontrolü
          kubectl rollout status deployment/model-api-deployment --timeout=60s

          
